name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.variant }} (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # CLI-only builds
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            variant: cli
            features: ""
            prefix: "aegis"
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
            variant: cli
            features: ""
            prefix: "aegis"
          # Full builds (with web dashboard)
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            variant: full
            features: "--features web-dashboard"
            prefix: "aegis-full"
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
            variant: full
            features: "--features web-dashboard"
            prefix: "aegis-full"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.variant }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.features }}

      - name: Run tests
        if: matrix.target == 'x86_64-unknown-linux-gnu' && matrix.variant == 'cli'
        run: cargo test --release

      - name: Run tests (web-dashboard)
        if: matrix.target == 'x86_64-unknown-linux-gnu' && matrix.variant == 'full'
        run: cargo test --release --features web-dashboard

      - name: Package
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          TARBALL="${{ matrix.prefix }}-${TAG}-${{ matrix.target }}.tar.gz"
          tar -czf "$TARBALL" \
            -C target/${{ matrix.target }}/release aegis \
            -C "$GITHUB_WORKSPACE" aegis.service aegis.toml uninstall.sh
          echo "TARBALL=$TARBALL" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.prefix }}-${{ matrix.target }}
          path: ${{ env.TARBALL }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
