name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --verbose

  test-web:
    name: Test (Web Dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: web-dashboard

      - name: Run tests with web-dashboard feature
        run: |
          cargo test --features web-dashboard 2>&1 | tee test_output.txt
          TOTAL=$(grep -oP '\d+(?= passed)' test_output.txt | paste -sd+ | bc)
          echo "TEST_COUNT=${TOTAL}" >> "$GITHUB_ENV"
          echo "Tests passed: ${TOTAL}"

      - name: Update test badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p .github/badges
          printf '{\n  "schemaVersion": 1,\n  "label": "tests",\n  "message": "%s passing",\n  "color": "brightgreen"\n}\n' "${TEST_COUNT}" > .github/badges/tests.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/tests.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: update test badge (${TEST_COUNT} tests)"
            git push
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (CLI)
        run: cargo clippy -- -D warnings

      - name: Clippy (Web Dashboard)
        run: cargo clippy --features web-dashboard -- -D warnings

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: cargo audit

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2

  build:
    name: Build release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build CLI-only
        run: cargo build --release

      - name: Build with web dashboard
        run: cargo build --release --features web-dashboard

      - name: Show binary sizes
        run: |
          echo "CLI-only:"
          ls -lh target/release/aegis
