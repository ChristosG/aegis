[package]
name = "aegis"
version = "0.6.2"
edition = "2021"
description = "Linux Security Monitoring & Response Tool"
license = "MIT"

[features]
default = []
web-dashboard = [
    "dep:axum",
    "dep:axum-extra",
    "dep:tower",
    "dep:tower-http",
    "dep:tokio-tungstenite",
]

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
procfs = "0.17"
inotify = "0.11"
nix = { version = "0.29", features = ["signal", "process", "user", "fs"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
lettre = { version = "0.11", features = ["tokio1-rustls-tls", "builder", "smtp-transport"], default-features = false }
ipnet = "2"
sha2 = "0.10"
regex = "1"
colored = "3"
tabled = "0.17"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
serde_json = "1"
dirs = "6"
hex = "0.4"
rpassword = "7"
rand = "0.8"
maxminddb = "0.24"
genpdf = "0.2"

# Optional web-dashboard dependencies
axum = { version = "0.8", features = ["ws"], optional = true }
axum-extra = { version = "0.10", features = ["typed-header"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors", "fs"], optional = true }
tokio-tungstenite = { version = "0.26", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
