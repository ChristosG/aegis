[package]
name = "aegis"
version = "2.1.0"
edition = "2021"
description = "Linux Security Monitoring & Response Tool"
license = "MIT"

[features]
default = []
web-dashboard = [
    "dep:axum",
    "dep:axum-extra",
    "dep:tower",
    "dep:tower-http",
    "dep:tokio-tungstenite",
]
ebpf = ["dep:aya", "dep:aya-log"]
tls-fingerprint = ["dep:pnet"]
yara = ["dep:yara-x"]
server = ["dep:tonic", "dep:prost"]

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
procfs = "0.17"
inotify = "0.11"
nix = { version = "0.29", features = ["signal", "process", "user", "fs"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
lettre = { version = "0.11", features = ["tokio1-rustls-tls", "builder", "smtp-transport"], default-features = false }
ipnet = "2"
sha2 = "0.10"
regex = "1"
colored = "3"
tabled = "0.17"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
serde_json = "1"
dirs = "6"
hex = "0.4"
rpassword = "7"
rand = "0.8"
maxminddb = "0.27"
genpdf = "0.2"
rustls = "0.23"
webpki-roots = "0.26"
x509-parser = "0.16"
libc = "0.2"

# Optional web-dashboard dependencies
axum = { version = "0.8", features = ["ws"], optional = true }
axum-extra = { version = "0.10", features = ["typed-header"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors", "fs"], optional = true }
tokio-tungstenite = { version = "0.26", optional = true }

# Optional eBPF dependencies
aya = { version = "0.13", optional = true }
aya-log = { version = "0.2", optional = true }

# Optional TLS fingerprinting
pnet = { version = "0.35", optional = true }

# Optional YARA scanning
yara-x = { version = "0.12", optional = true }

# Optional gRPC server
tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

[package.metadata.deb]
maintainer = "ChristosG"
depends = "iptables | nftables, systemd"
recommends = "fail2ban"
section = "admin"
priority = "optional"
conflicts = "aegis-full"
replaces = "aegis-full"
provides = "aegis"
extended-description = """\
Aegis monitors your Linux server for network attacks, malware, \
brute-force attempts, file tampering, web exploits, and known-malicious IPs, \
then automatically blocks them. Single static binary."""
maintainer-scripts = "debian/scripts/"
assets = [
    ["target/release/aegis", "usr/local/bin/", "755"],
    ["aegis.toml", "etc/aegis/", "644"],
    ["aegis.service", "lib/systemd/system/", "644"],
    ["uninstall.sh", "usr/share/aegis/", "755"],
]

[package.metadata.deb.variants.full]
name = "aegis-full"
features = ["web-dashboard"]
conflicts = "aegis"
replaces = "aegis"
provides = "aegis"
extended-description = """\
Aegis with web dashboard. Monitors your Linux server for network attacks, \
malware, brute-force attempts, file tampering, web exploits, and \
known-malicious IPs, then automatically blocks them."""

[package.metadata.deb.variants.enterprise]
name = "aegis-enterprise"
features = ["web-dashboard", "ebpf", "tls-fingerprint", "yara", "server"]
conflicts = "aegis, aegis-full"
replaces = "aegis, aegis-full"
provides = "aegis"
extended-description = """\
Aegis Enterprise with all features: web dashboard, eBPF real-time monitoring, \
TLS fingerprinting, YARA scanning, and gRPC fleet server."""
